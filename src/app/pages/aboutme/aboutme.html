<div class="container about">
	<p class="eyebrow">{{ 'about.eyebrow' | translate }}</p>
	<h2 class="title">{{ 'about.title' | translate }}</h2>
	<div class="about-content">
		<div class="about-copy">
			<p class="text">
				{{ 'about.p1' | translate }}
			</p>
			<p class="text">
				{{ 'about.p2' | translate }}
			</p>
			<p class="text">
				{{ 'about.p3' | translate }}
			</p>
		</div>

		<figure class="about-photo">
			<img class="photo" src="/assets/imgs/fotosobremi.jpeg" [attr.alt]="'about.photoAlt' | translate" />
			<figcaption class="caption">{{ 'about.photoCaption' | translate }}</figcaption>
		</figure>
	</div>
</div>
